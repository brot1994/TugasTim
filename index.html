:root{color-scheme:light dark;

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:20;background:#0d1220;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}

header{padding-top:env(safe-area-inset-top)}
.link{background:none;border:0;color:var(--co2);font:500 15px Inter,sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;padding:0}

.sbar{height:6px;border-radius:99px;background:var(--zone);overflow:hidden;margin:6px 0 2px}.sbar i{display:block;height:100%;background:var(--pro)}
.steps{list-style:none;padding:0;margin:4px 0 12px}.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}

@media(max-width:600px){.srow{grid-template-columns:22px minmax(0,1fr) 44px}.srow .sd{grid-column:2}}

async function compress(file,max=1024,q=0.6){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',q);return out.length>700000&&max>600?compress(file,max-256,q-0.1):out}finally{URL.revokeObjectURL(url)}}
