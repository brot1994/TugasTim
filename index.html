<style>
/* VOICE: calm, direct factory work app in Indonesian
   IDEA: a production work-order tag; every tugas carries a status stamp
   PICTURE: the live task board itself, right under a cobalt strip
   COLOUR/TYPE: cobalt strip, white, pale cobalt zones; status red/amber/blue/green; Space Grotesk + Inter
   LAYOUT: one phone column up to 860px, sticky header, bottom nav, sheets slide up */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0a0d18);--card:light-dark(#fff,#131829);--ink:light-dark(#0d1220,#e8ecf8);--mut:light-dark(#5b6478,#9aa3bb);

*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.brand,.num{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,5vw,34px);margin:6px 0 4px}h2{font-size:22px;margin:8px 0 12px}h3{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
header{position:sticky;top:0;z-index:5;background:var(--co);color:#fff}
.hd{max-width:860px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{font-size:21px}.hdate{font-size:13px;opacity:.85}
.chip{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;min-height:40px;padding:4px 14px;font:600 14px Inter,sans-serif;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;cursor:pointer}
.chip small{font-weight:400;font-size:13px;opacity:.85}
body.out .chip,body.out nav,body.out #fab{display:none!important}
main{max-width:860px;margin:auto;padding:16px 16px 140px}
nav{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}

#fab{position:fixed;right:max(16px,calc(50vw - 414px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;background:var(--co);color:#fff;border:0;border-radius:99px;min-height:52px;padding:0 22px;font:600 16px Inter,sans-serif;box-shadow:0 6px 18px rgba(18,64,224,.35);cursor:pointer}
.list{display:grid;gap:10px}

.tk:hover{border-color:var(--co2)}
.tk-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tk-t{font-weight:600;font-size:16px;margin:6px 0 4px}
.tk-m{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.pill{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-late{color:var(--late);background:color-mix(in srgb,var(--late) 14%,transparent)}
.s-pro{color:var(--pro);background:color-mix(in srgb,var(--pro) 14%,transparent)}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.s-new,.s-today{color:var(--mut);background:color-mix(in srgb,var(--mut) 14%,transparent)}

.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--zone)}
.bar i{display:block}.b-late{background:var(--late)}.b-open{background:var(--pro)}.b-ok{background:var(--ok)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:8px 2px 0}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
input,select,textarea{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--co2);outline-offset:2px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:12px}label>input,label>select,label>textarea{margin-top:5px}
.lbl{font-size:14px;font-weight:500;margin-bottom:5px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}

.day input:checked+span{background:var(--co);color:#fff;border-color:var(--co)}.day input:focus-visible+span{outline:2px solid var(--co2)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.pri{background:var(--co);border-color:var(--co);color:#fff}.btn.dang{color:var(--late)}.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.acts .btn{flex:1 1 140px}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(5,10,25,.5);display:flex;align-items:flex-end;justify-content:center}
#sheetIn{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){#sheetIn{animation:none}}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0 0 12px;font-size:15px}.meta dt{color:var(--mut)}.meta dd{margin:0}
.note{background:var(--zone);border-radius:10px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap}
.ph{margin:0 0 12px}.ph img,#fprev{width:100%;max-height:340px;object-fit:contain;background:var(--zone);border-radius:10px;display:block}
.ph figcaption,.hint,#finfo{font-size:13px;color:var(--mut);margin-top:5px;display:block}
.fin{border:2px dashed var(--co2);border-radius:12px;padding:12px 14px;margin:12px 0}.fin p{margin:4px 0 10px;color:var(--mut);font-size:14px}
.log{list-style:none;padding:0;margin:0;font-size:14px}.log li{padding:7px 0;border-top:1px solid var(--line)}
.log time{display:block;font-size:13px;color:var(--mut)}
.cmt{display:flex;gap:8px;margin-top:10px}.cmt input{flex:1}
.wa{background:light-dark(#e7f6e7,#11251a);border-radius:12px;padding:14px;white-space:pre-wrap;font:14px/1.5 Inter,sans-serif;margin:0}
.zone{background:var(--zone);border-radius:12px;padding:14px;margin-top:18px}.zone p{margin:6px 0 0}
.zone input{width:auto;min-height:40px;padding:4px 8px;display:inline-block}
.urow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}.urow:first-child{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--zone);color:var(--co2);font:600 15px "Space Grotesk",sans-serif}
.urow .grow{flex:1}.urow small{display:block;color:var(--mut);font-size:13px}
.urow .btn{min-height:40px;padding:0 12px;font-size:14px}
.login{max-width:460px;margin:24px auto}.login .urow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:60px}
.empty{padding:26px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.demo{font-size:13px;color:var(--mut);text-align:center;margin-top:28px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:20;background:#0d1220;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:600px){.cnt{grid-template-columns:repeat(2,minmax(0,1fr))}.prow{grid-template-columns:6.5em minmax(0,1fr) auto}}

header{padding-top:env(safe-area-inset-top)}
.link{background:none;border:0;color:var(--co2);font:500 15px Inter,sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;padding:0}
.err{color:var(--late);font-size:14px;min-height:20px;margin:4px 0 8px}
.center{text-align:center;padding:60px 16px;color:var(--mut)}
#phbox{min-height:60px;color:var(--mut);font-size:14px}
</style></head><body class="out">

<script type="module">
import {initializeApp,deleteApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

const cfg={apiKey:"AIzaSyBayp-pQr75qZC30vem2Y1vL3D8iUP7S3U",authDomain:"agi-tugas-tim.firebaseapp.com",projectId:"agi-tugas-tim",storageBucket:"agi-tugas-tim.firebasestorage.app",messagingSenderId:"223069654056",appId:"1:223069654056:web:a9058e0c7171c9cf5af91d"};
const DOMAIN='tugastim.app',OWNER='bram',KEEP_DONE_DAYS=60,KEEP_PHOTO_DAYS=90;

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PRIO={T:'Tinggi',S:'Sedang',R:'Rendah'};
const ic=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

done:ic('<path d="M4 12.5l5 5L20 6.5"/>')};
const ERR={'auth/invalid-credential':'Username atau password salah','auth/wrong-password':'Username atau password salah','auth/user-not-found':'Username atau password salah','auth/invalid-email':'Username tidak valid (pakai huruf/angka tanpa spasi)','auth/email-already-in-use':'Username sudah dipakai','auth/weak-password':'Password minimal 6 karakter','auth/network-request-failed':'Tidak ada koneksi internet','auth/too-many-requests':'Terlalu banyak percobaan, tunggu sebentar','permission-denied':'Tidak punya izin untuk ini','unavailable':'Sedang offline, coba lagi nanti'};
const emsg=e=>ERR[e&&e.code]||('Gagal: '+((e&&(e.code||e.message))||'error'));

let view='loading',me=null,U={},TO={},TD={},P={},SET={jam:'07:00'},ready={},unsubs=[],tab='',filt={st:'semua',who:'',q:''},F={},pending=null,sheet={mode:null,id:null},photoCache={},genDay='',cleaned=false,settingUp=false;
const tasks=()=>Object.values({...TD,...TO});
const byId=id=>TO[id]||TD[id];
const users=()=>Object.values(U).filter(u=>u.active!==false).sort((a,b)=>a.role!==b.role?(a.role==='admin'?-1:1):a.name.localeCompare(b.name));
const uname=id=>id==='sistem'?'Sistem':(U[id]?U[id].name:'(tidak dikenal)');
const isAdm=()=>me&&me.role==='admin';
const isLate=x=>x.status!=='selesai'&&new Date(x.due)<new Date();
const stOf=x=>x.status==='selesai'?'ok':isLate(x)?'late':x.status==='proses'?'pro':x.due.slice(0,10)===dstr(new Date())?'today':'new';
const ST={ok:'Selesai',late:'Terlambat',pro:'Dikerjakan',today:'Belum mulai',new:'Belum mulai'};
const entry=m=>({t:Date.now(),who:me.id,msg:m});
function when(ms){if(!ms)return '';const d=new Date(ms),D=dstr(d),n=new Date();const p=D===dstr(n)?'hari ini':D===dstr(addDays(n,-1))?'kemarin':d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});return p+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
const full=due=>new Date(due.slice(0,10)+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+', '+due.slice(11,16);
function dueTxt(x){const d=new Date(x.due),now=new Date(),D=x.due.slice(0,10),jam=x.due.slice(11,16);
 if(x.status==='selesai')return 'Selesai '+when(x.doneAt);
 if(d<now){const h=Math.floor((now-d)/864e5);return h>=1?`Lewat ${h} hari`:`Lewat ${Math.max(1,Math.round((now-d)/36e5))} jam`}
 if(D===dstr(now))return 'Hari ini '+jam;if(D===dstr(addDays(now,1)))return 'Besok '+jam;
 return new Date(D+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})+' '+jam}
const ruleTxt=p=>(p.rep==='harian'?'Setiap hari':p.rep==='mingguan'?'Setiap '+(p.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>HARI[d]).join(', '):'Setiap tanggal '+p.date)+', jam '+p.time;
const sortT=(a,b)=>(a.status==='selesai')-(b.status==='selesai')||(a.status==='selesai'?b.doneAt-a.doneAt:a.due.localeCompare(b.due));
const avatar=n=>esc(String(n).replace(/^Om |^Ketua /,'').slice(0,2).toUpperCase());
function card(x){const s=stOf(x);return `<button class="tk" data-open="${esc(x.id)}"><div class="tk-top"><span class="pill s-${s}">${ST[s]}</span>${x.prio==='T'?'<span class="pill pr">Prioritas tinggi</span>':''}${x.tpl?'<span class="rep">↻ berulang</span>':''}</div><div class="tk-t">${esc(x.title)}</div><div class="tk-m"><span>${esc(uname(x.to))}</span><span class="due d-${s}">${esc(dueTxt(x))}</span></div></button>`}
const listOr=(a,e)=>a.length?`<div class="list">${a.map(card).join('')}</div>`:`<div class="empty">${e}</div>`;
const FL={semua:()=>true,late:isLate,hari:x=>x.status!=='selesai'&&x.due.slice(0,10)===dstr(new Date()),baru:x=>x.status==='baru'&&!isLate(x),proses:x=>x.status==='proses'&&!isLate(x),selesai:x=>x.status==='selesai'};
function listHtml(){let a=tasks().filter(FL[filt.st]);if(filt.who)a=a.filter(x=>x.to===filt.who);
 if(filt.q){const q=filt.q.toLowerCase();a=a.filter(x=>(x.title+' '+(x.note||'')+' '+uname(x.to)).toLowerCase().includes(q))}
 a.sort(sortT);return a.length?a.map(card).join(''):'<div class="empty">Tidak ada tugas yang cocok.</div>'}
function groups(){const n=new Date(),T=dstr(n),Y=dstr(addDays(n,-1)),A=tasks();
 return {L:A.filter(isLate).sort(sortT),H:A.filter(x=>x.status!=='selesai'&&!isLate(x)&&x.due.slice(0,10)===T).sort(sortT),
 P:A.filter(x=>x.status==='proses'&&!isLate(x)&&x.due.slice(0,10)!==T).sort(sortT),D:A.filter(x=>x.status==='selesai'&&dstr(new Date(x.doneAt))===Y)}}
function reportText(){const {L,H,P,D}=groups(),n=new Date();
 const sec=(t,a,f)=>`${t} (${a.length})\n`+(a.length?a.map((x,i)=>`${i+1}. ${uname(x.to)} – ${(x.title+' '+f(x)).trim()}`).join('\n'):'– tidak ada');
 const ppl=users().map(u=>{const m=tasks().filter(x=>x.to===u.id);const o=m.filter(x=>x.status!=='selesai').length,l=m.filter(isLate).length;return o?`• ${u.name}: ${o} belum selesai${l?`, ${l} terlambat`:''}`:''}).filter(Boolean);
 return `*LAPORAN TUGAS TIM*\n${n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\n\n`+
 sec('🔴 *Terlambat*',L,x=>`(${dueTxt(x).toLowerCase()})`)+'\n\n'+sec('📅 *Deadline hari ini*',H,x=>`(${x.due.slice(11,16)})`)+'\n\n'+
 sec('🔧 *Sedang dikerjakan*',P,x=>`(deadline ${dueTxt(x).toLowerCase()})`)+'\n\n'+sec('✅ *Selesai kemarin*',D,()=>'')+

async function compress(file,max=1024,q=0.6){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',q);return out.length>700000&&max>600?compress(file,max-256,q-0.1):out}finally{URL.revokeObjectURL(url)}}

 case 'close':return closeSheet();
 case 'logout':closeSheet();return signOut(auth);
 case 'setup':return openSheet(`<form id="setup"><h2>Setup pertama kali</h2><p class="sub">Membuat akun admin utama dengan username <b>${OWNER}</b>. Hanya perlu sekali.</p><label>Password baru (min. 6)<input name="p" type="password" autocomplete="new-password" required></label><label>Ulangi password<input name="p2" type="password" autocomplete="new-password" required></label><div class="err" id="serr"></div><div class="acts"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Buat akun admin</button></div></form>`,'setup');
 case 'start':return W(updateDoc(ref,{status:'proses',log:arrayUnion(entry('mulai mengerjakan'))}),'Status: dikerjakan');
 case 'finish':pending=null;sheet.mode='finish';$('#dacts').hidden=true;$('#fin').innerHTML=`<div class="fin"><b>Foto bukti wajib</b><p>Ambil foto hasil pekerjaan. Foto otomatis dikecilkan sebelum disimpan.</p><label class="btn">Ambil / pilih foto<input type="file" accept="image/*" capture="environment" id="ff" hidden></label><img id="fprev" hidden alt="Pratinjau foto bukti"><small id="finfo"></small><div class="acts"><button class="btn" data-act="cancelfin" data-id="${esc(id)}">Batal</button><button class="btn pri" id="savefin" data-act="savefin" data-id="${esc(id)}" disabled>Simpan selesai</button></div></div>`;$('#fin').scrollIntoView({behavior:'smooth',block:'center'});return;
 case 'cancelfin':return openDetail(id);
 case 'savefin':{if(!pending)return toast('Foto bukti wajib diisi');b.disabled=true;$('#finfo').textContent='Menyimpan…';const ph=pending;
  const ok=await W(setDoc(doc(db,'photos',id),{data:ph,at:Date.now()}).then(()=>updateDoc(ref,{status:'selesai',doneAt:Date.now(),hasPhoto:true,log:arrayUnion(entry('menandai selesai dengan foto bukti'))})),'Tugas selesai 👍');
  if(ok){photoCache[id]={data:ph,at:Date.now()};pending=null;openDetail(id,true)}else b.disabled=false;return}
 case 'reopen':await W(updateDoc(ref,{status:'proses',doneAt:null,hasPhoto:false,log:arrayUnion(entry('membuka lagi tugas ini'))}),'Tugas dibuka lagi');deleteDoc(doc(db,'photos',id)).catch(()=>{});delete photoCache[id];return;
 case 'edit':return openForm(id);
 case 'del':$('#aacts').innerHTML=`<span style="flex:1 1 100%">Hapus tugas ini?</span><button class="btn" data-act="cancelfin" data-id="${esc(id)}">Batal</button><button class="btn dang" data-act="del2" data-id="${esc(id)}">Ya, hapus</button>`;return;
 case 'del2':closeSheet();await W(deleteDoc(ref),'Tugas dihapus');deleteDoc(doc(db,'photos',id)).catch(()=>{});return;
 case 'tog':{const p=P[id];genDay='';return W(updateDoc(doc(db,'tpls',id),{on:!p.on}),p.on?'Dijeda':'Diaktifkan')}
 case 'deltpl':if(d.sure)return W(deleteDoc(doc(db,'tpls',id)),'Tugas berulang dihapus');b.dataset.sure='1';b.textContent='Yakin hapus?';return;
 case 'role':{const u=U[id];const r=u.role==='admin'?'member':'admin';return W(updateDoc(doc(db,'users',id),{role:r}),u.name+' sekarang '+(r==='admin'?'admin':'anggota'))}
 case 'delu':if(d.sure)return W(updateDoc(doc(db,'users',id),{active:false}),'Akun dinonaktifkan');b.dataset.sure='1';b.textContent='Yakin?';return;
 case 'copy':{const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Teks laporan disalin')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#rep'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Teks sudah diblok, salin manual')});return}
 }});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
 if(f.id==='login'){const er=$('#lerr'),btn=f.querySelector('button');er.textContent='';btn.disabled=true;
  try{await signInWithEmailAndPassword(auth,mail(f.elements.u.value),f.elements.p.value)}catch(x){er.textContent=emsg(x)}btn.disabled=false;return}
 if(f.id==='setup'){const er=$('#serr'),p=f.elements.p.value;if(p.length<6)return er.textContent='Password minimal 6 karakter';if(p!==f.elements.p2.value)return er.textContent='Password tidak sama';
  er.textContent='Membuat akun…';settingUp=true;
  try{const c=await createUserWithEmailAndPassword(auth,mail(OWNER),p);await setDoc(doc(db,'users',c.user.uid),{name:'Bram',username:OWNER,jab:'Admin',role:'admin',active:true,created:Date.now()});settingUp=false;closeSheet();boot(c.user)}
  catch(x){settingUp=false;er.textContent=x.code==='auth/email-already-in-use'?'Akun admin utama sudah ada. Silakan masuk dengan username bram.':emsg(x);if(auth.currentUser)boot(auth.currentUser)}return}
 if(f.id==='frm')return saveForm(f);
 if(f.id==='addu')return createAccount(f);
 if(f.id==='pw'){const er=$('#pwerr'),n=f.elements.n.value;if(n.length<6)return er.textContent='Password baru minimal 6 karakter';er.textContent='Menyimpan…';
  try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,f.elements.o.value));await updatePassword(u,n);closeSheet();toast('Password diganti')}catch(x){er.textContent=emsg(x)}return}
 if(f.id==='cmt'){const c=f.elements.c.value.trim();if(!c)return;f.elements.c.value='';W(updateDoc(doc(db,'tasks',f.dataset.id),{log:arrayUnion(entry('💬 '+c))}))}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){filt.q=e.target.value;$('#list').innerHTML=listHtml()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='fwho'){filt.who=t.value;$('#list').innerHTML=listHtml()}
 if(t.id==='jam'&&t.value)W(setDoc(doc(db,'settings','main'),{jam:t.value},{merge:true}),'Jam laporan: '+t.value);
 if(t.id==='ff'&&t.files[0]){$('#finfo').textContent='Memproses foto…';try{pending=await compress(t.files[0]);const im=$('#fprev');im.src=pending;im.hidden=false;
  $('#finfo').textContent='Ukuran setelah dikecilkan ± '+Math.round(pending.length*.75/1024)+' KB';$('#savefin').disabled=false}catch(_){$('#finfo').textContent='Foto tidak bisa dibaca, coba foto lain.'}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
setInterval(()=>{if(view==='app'&&ready.all){gen();if(sheet.mode!=='form'&&sheet.mode!=='finish')render()}},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
